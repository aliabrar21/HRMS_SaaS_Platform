services:
  - type: web
    name: hrms-backend
    env: node
    region: oregon
    rootDir: hrms
    buildCommand: npm install -g pnpm && pnpm install && pnpm run db:generate && pnpm build
    startCommand: cd backend && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

databases:
  - name: hrms-db
    region: oregon
    databaseName: hrms
